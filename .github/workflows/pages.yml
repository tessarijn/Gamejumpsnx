name: Publiceer SNX World

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundel de site
        run: mkdir -p _site && cp *.html manifest.webmanifest sw.js _site/ && cp -r assets icons _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Code husselen (minify + mangle)
        run: |
          npm i -g html-minifier-terser@7
          for f in _site/*.html; do
            html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js '{"mangle":{"toplevel":true},"compress":{"passes":2}}' -o "$f.min" "$f" && mv "$f.min" "$f"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
