<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff2625">
<title>SNX Derby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&family=Cairo:wght@500;700;800&display=swap">
<style>
/* SNX Derby: racecard + bet slip like a British betting shop, race drawn on a canvas. Brand: SNX red, white, ink, Poppins.
   Languages: Dutch, English, Arabic (right-to-left, Cairo for Arabic glyphs). */
:root {
  --snx: #ff2625;
  --snx-dark: #d12325;
  --ink: #111111;
  --paper: #ffffff;
  --steen: #e7e5e0;
  --up: #1f8a3b;
  --font: 'Poppins', 'Cairo', system-ui, sans-serif;
  color-scheme: light;
}
:root[lang="ar"] { --font: 'Cairo', 'Poppins', system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--snx); color: var(--ink); font-family: var(--font); -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; cursor: pointer; }
[hidden] { display: none !important; }
bdi { unicode-bidi: isolate; }

.top { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 6px; max-width: 1080px; margin: 0 auto; }
.top .logo { height: 44px; width: auto; }
.top .brand { flex: 1; min-width: 0; color: #fff; }
.top .brand b { display: block; font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; text-shadow: 0 2px 0 var(--ink); }
.top .brand span { font-size: 12px; font-weight: 600; }
.bank { background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); padding: 4px 10px; text-align: end; line-height: 1.05; }
.bank small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--snx-dark); }
.bank b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.bank span { font-size: 11px; font-weight: 600; margin-inline-start: 2px; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 1080px; margin: 0 auto; padding: 4px 16px 10px; }
.langs { display: flex; border: 2px solid #fff; border-radius: 10px; overflow: hidden; }
.langs button { background: transparent; color: #fff; border: 0; font-weight: 800; font-size: 12px; padding: 6px 10px; min-width: 40px; }
.langs button + button { border-inline-start: 2px solid #fff; }
.langs button.on { background: #fff; color: var(--snx-dark); }
.langs button[data-lang="ar"] { font-family: 'Cairo', sans-serif; font-size: 13px; padding-block: 4px; }
.tool { background: transparent; border: 2px solid #fff; color: #fff; border-radius: 10px; font-weight: 800; font-size: 12px; padding: 6px 10px; }
.tool.dark { background: var(--ink); border-color: var(--ink); }
.bar .sp { flex: 1; }
@media (max-width: 480px) { .top { gap: 8px; } .top .logo { height: 34px; } .top .brand b { font-size: 19px; } .top .brand span { display: none; } }

main { max-width: 1080px; margin: 0 auto; padding: 0 16px 28px; display: grid; gap: 14px; }
.race-head { color: #fff; }
.race-head b { display: block; font-size: 20px; font-weight: 800; text-transform: uppercase; line-height: 1.15; text-shadow: 0 2px 0 var(--ink); }
.race-head span { font-size: 13px; font-weight: 600; }

.stage { position: relative; background: var(--ink); border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 6px 0 var(--ink); }
#cv { display: block; width: 100%; height: clamp(280px, 78vw, 440px); direction: ltr; }
.ticker { background: var(--ink); color: #fff; padding: 8px 12px 4px; font-weight: 700; font-size: 15px; min-height: 2.4em; }
.order { background: var(--ink); color: #fff; padding: 0 12px 10px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; font-weight: 700; min-height: 30px; }
.order > span { display: inline-flex; align-items: center; gap: 4px; background: #2a2a2a; border-radius: 999px; padding-block: 2px; padding-inline: 2px 8px; }
.ctrl { position: absolute; inset-inline-end: 10px; top: 10px; display: flex; gap: 6px; }
.ctrl button { background: rgba(17,17,17,.75); color: #fff; border: 2px solid #fff; border-radius: 10px; font-weight: 800; font-size: 12px; padding: 5px 9px; }
.ctrl button.on { background: #fff; color: var(--ink); }

.grid { display: grid; gap: 14px; align-items: start; }
@media (min-width: 860px) { .grid { grid-template-columns: 1.25fr 1fr; } .slip { position: sticky; top: 12px; } }
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); padding: 14px; }
.card h2 { margin: 0 0 10px; font-size: 18px; font-weight: 800; text-transform: uppercase; color: var(--snx-dark); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h2 small { font-size: 11px; color: var(--ink); font-weight: 700; letter-spacing: .02em; text-transform: none; }

.runners { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.runner { display: grid; grid-template-columns: 34px 46px 1fr auto; align-items: center; gap: 10px; border: 2px solid var(--ink); border-radius: 14px; padding: 6px 8px; background: #fff; }
.runner.sel { background: #fff1f0; outline: 3px solid var(--snx); outline-offset: -1px; }
.silk { width: 34px; height: 34px; border-radius: 9px; border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none; }
.silk i { font-style: normal; background: #fff; color: var(--ink); border-radius: 999px; width: 21px; height: 21px; display: grid; place-items: center; border: 1.5px solid var(--ink); font-size: 12px; font-family: 'Poppins', sans-serif; }
.pic { width: 46px; height: 40px; object-fit: contain; }
.roundel { width: 40px; height: 40px; border-radius: 50%; background: var(--snx); display: grid; place-items: center; border: 2px solid var(--ink); justify-self: center; }
.roundel img { width: 30px; }
.nm { min-width: 0; }
.nm b { display: block; font-weight: 800; font-size: 15px; line-height: 1.15; }
.nm small { display: block; font-size: 12px; font-weight: 500; color: #444; }
.nm small em { font-style: normal; font-weight: 800; color: var(--ink); letter-spacing: .04em; }
.odds { min-width: 74px; background: var(--ink); color: #fff; border: 0; border-radius: 12px; padding: 8px; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums;
  font-family: 'Poppins', sans-serif; box-shadow: 0 3px 0 var(--snx-dark); position: relative; }
.odds:disabled { cursor: default; box-shadow: none; }
.odds .mv { position: absolute; top: -8px; inset-inline-end: -6px; font-size: 10px; border-radius: 999px; padding: 1px 5px; background: #fff; border: 1.5px solid var(--ink); }
.odds .mv.up { color: var(--up); }
.odds .mv.dn { color: var(--snx-dark); }
.odds.flash { animation: flash .6s; }
@keyframes flash { 50% { background: var(--snx); } }
.pos { font-weight: 800; font-size: 13px; color: var(--snx-dark); }

.slip .pick { border: 2px dashed var(--ink); border-radius: 12px; padding: 10px; font-weight: 600; font-size: 14px; min-height: 48px; }
.slip .pick b { font-weight: 800; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; margin-top: 10px; }
.seg button { background: #fff; border: 0; padding: 9px 4px; font-weight: 800; font-size: 14px; text-transform: uppercase; }
.seg button + button { border-inline-start: 2px solid var(--ink); }
.seg button.on { background: var(--ink); color: #fff; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; direction: ltr; }
.chips button { aspect-ratio: 1; border-radius: 50%; border: 3px dashed #fff; background: var(--snx); color: #fff; font-weight: 800; font-size: 15px; font-family: 'Poppins', sans-serif;
  box-shadow: 0 0 0 2px var(--ink), 0 3px 0 2px var(--ink); max-width: 64px; justify-self: center; width: 100%; }
.chips button.on { background: var(--ink); }
.chips button:disabled { opacity: .35; cursor: default; }
.info { font-size: 13px; font-weight: 600; margin: 10px 0 0; min-height: 2.6em; }
.btn { width: 100%; margin-top: 10px; font-size: 18px; font-weight: 800; text-transform: uppercase; border-radius: 999px; background: #fff; color: var(--snx-dark);
  border: 3px solid var(--ink); padding: 10px 14px 9px; box-shadow: 0 5px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.go { background: var(--snx); color: #fff; font-size: 22px; }
.btn.alt { background: var(--ink); color: #fff; }
.slip h3 { margin: 14px 0 6px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; }
.bets { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.bets li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; background: var(--steen); border-radius: 10px; padding: 6px 8px; font-size: 13px; font-weight: 600; }
.bets li b { font-weight: 800; }
.bets li .x { border: 0; background: var(--ink); color: #fff; border-radius: 8px; width: 26px; height: 26px; font-weight: 800; }
.bets .empty { background: transparent; padding: 0; font-weight: 500; color: #555; display: block; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.foot { color: #fff; font-size: 12px; font-weight: 600; text-align: center; margin: 4px 0 0; }
.foot a { color: #fff; }

dialog { border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 8px 0 var(--ink); padding: 18px; width: min(440px, calc(100% - 32px)); max-height: calc(100% - 32px); font-family: var(--font); }
dialog::backdrop { background: rgba(17,17,17,.6); }
dialog h2 { margin: 0 0 10px; font-size: 24px; font-weight: 800; text-transform: uppercase; color: var(--snx-dark); }
dialog p, dialog li { font-size: 14px; font-weight: 500; line-height: 1.45; }
dialog ul { padding-inline-start: 18px; margin: 8px 0; }
.places { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
.places li { display: grid; grid-template-columns: 44px 34px 1fr auto; gap: 8px; align-items: center; font-weight: 700; border-bottom: 1px solid var(--steen); padding-bottom: 6px; }
.places .p { font-size: 18px; font-weight: 800; color: var(--snx-dark); }
.net { text-align: center; border-radius: 14px; padding: 10px; margin: 8px 0; background: var(--ink); color: #fff; }
.net b { display: block; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.net.win { background: var(--up); }
.payouts { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.payouts li { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.payouts li.won b { color: var(--up); }
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="assets/logo_white.webp" alt="SNX">
  <div class="brand"><b>SNX Derby</b><span data-i18n="tagline"></span></div>
  <div class="bank" aria-live="polite"><small data-i18n="balance"></small><b id="bal">1000</b><span data-i18n="coins"></span></div>
</header>
<nav class="bar">
  <div class="langs" role="group" id="langs" aria-label="Taal / Language / اللغة">
    <button type="button" data-lang="nl" lang="nl">NL</button>
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="ar" lang="ar">عربي</button>
  </div>
  <span class="sp"></span>
  <button class="tool" id="mute" type="button" aria-pressed="false"></button>
  <button class="tool dark" id="helpBtn" type="button" data-i18n="help"></button>
</nav>

<main>
  <section class="race-head"><b id="raceName"></b><span id="raceMeta"></span></section>

  <section class="stage">
    <canvas id="cv"></canvas>
    <div class="ctrl" id="ctrl" hidden>
      <button id="fast" type="button" aria-pressed="false">2×</button>
      <button id="skip" type="button" data-i18n="skip"></button>
    </div>
    <div class="ticker" id="ticker" aria-live="polite"></div>
    <div class="order" id="order"></div>
  </section>

  <div class="grid">
    <section class="card">
      <h2><span data-i18n="card"></span> <small data-i18n="placeRule"></small></h2>
      <ol class="runners" id="runners"></ol>
    </section>

    <section class="card slip">
      <h2 data-i18n="slip"></h2>
      <div class="pick" id="pick"></div>
      <div class="seg" role="group">
        <button type="button" data-type="win" class="on" aria-pressed="true" data-i18n="win"></button>
        <button type="button" data-type="ew" aria-pressed="false" data-i18n="ew"></button>
      </div>
      <div class="chips" id="chips">
        <button type="button" data-chip="10">10</button>
        <button type="button" data-chip="25" class="on">25</button>
        <button type="button" data-chip="50">50</button>
        <button type="button" data-chip="100">100</button>
        <button type="button" data-chip="250">250</button>
      </div>
      <p class="info" id="info"></p>
      <button class="btn alt" id="place" type="button" disabled data-i18n="place"></button>
      <h3><span data-i18n="yourBets"></span><span id="betTotal"></span></h3>
      <ul class="bets" id="bets"></ul>
      <button class="btn go" id="go" type="button" data-i18n="start"></button>
      <button class="btn" id="refill" type="button" hidden data-i18n="refill"></button>
    </section>
  </div>

  <p class="foot"><span data-i18n="foot"></span> <a href="https://www.snxfood.com" target="_blank" rel="noopener">snxfood.com</a></p>
</main>

<dialog id="result">
  <h2 id="resTitle"></h2>
  <ol class="places" id="places"></ol>
  <div class="net" id="net"></div>
  <ul class="payouts" id="payouts"></ul>
  <button class="btn go" id="next" type="button" data-i18n="next"></button>
</dialog>

<dialog id="help">
  <h2 data-i18n="helpTitle"></h2>
  <ul id="helpList"></ul>
  <button class="btn" id="helpClose" type="button" data-i18n="gotIt"></button>
</dialog>

  c.save(); c.scale(1 / s, 1 / s); c.fillStyle = '#111'; c.font = `800 ${Math.max(7, Math.round(s * 0.07))}px Poppins, sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(r.i + 1), -0.03 * s, -0.072 * s); c.restore();
  c.fillStyle = '#2a1d16'; c.beginPath(); c.ellipse(-0.03, -0.175, 0.12, 0.03, -0.04, 0, 7); c.fill();

  // rider: the product itself
  const rb = moving ? Math.sin(ph * 2) * 0.012 : 0;
  const im = IMG[h.id];
  if (im && im.complete && im.naturalWidth) {
    const hh = h.id === 'doos' ? 0.28 : 0.34, ww = Math.min(0.42, hh * im.naturalWidth / im.naturalHeight), hgt = ww * im.naturalHeight / im.naturalWidth;
    c.drawImage(im, -0.04 - ww / 2, -0.18 - hgt + rb, ww, hgt);
  } else {
    c.fillStyle = '#ff2625'; c.strokeStyle = '#fff'; c.lineWidth = 0.022;
    c.beginPath(); c.arc(-0.04, -0.34 + rb, 0.15, 0, 7); c.fill(); c.stroke();
    logoAt(c, IMG.logo && IMG.logo.complete ? IMG.logo : null, -0.04, -0.34 + rb, 0.24, 0.2);
  }
  c.restore();
}

// ---------- Go ----------
applyLang();
newRace();
resize();
if (document.fonts) {
  Promise.all(['800 20px Poppins', '800 20px Cairo'].map((f) => document.fonts.load(f).catch(() => null))).then(draw);
}
