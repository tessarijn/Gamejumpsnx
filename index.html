<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff2625">
<meta name="description" content="SNX World: speel gratis snackgames van SNX. Snack Rush, Snack Match, Club Cup en meer.">
<title>SNX World</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap">
<style>
  :root { --rood: #ff2625; --rood-donker: #d12325; --zwart: #111; --wit: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', Arial, sans-serif; color: var(--wit); min-height: 100vh;
    background: var(--rood) url('assets/backdrop.webp') center / cover fixed;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { text-align: center; margin: 8px 0 22px; }
  header img { width: 140px; height: auto; }
  .kaart-kop {
    display: inline-block; margin-top: 14px; background: var(--zwart); border-radius: 18px;
    padding: 12px 20px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  h1 { font-weight: 800; font-size: clamp(28px, 7vw, 44px); letter-spacing: .5px; line-height: 1.05; }
  .sub { font-weight: 500; font-size: 15px; opacity: .9; margin-top: 4px; }
  .filters { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 0 0 18px; }
  .filters button {
    font: 600 14px 'Poppins', sans-serif; color: var(--wit); background: rgba(0,0,0,.35);
    border: 2px solid transparent; border-radius: 999px; padding: 7px 14px; cursor: pointer;
  }
  .filters button.aan { background: var(--wit); color: var(--rood-donker); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .game {
    position: relative; display: flex; flex-direction: column; background: var(--zwart);
    border-radius: 20px; overflow: hidden; text-decoration: none; color: var(--wit);
    box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .15s;
  }
  .game:hover, .game:focus-visible { transform: translateY(-3px); outline: none; }
  .beeld { height: 130px; display: flex; align-items: center; justify-content: center; background: var(--rood-donker); }
  .beeld img { max-height: 104px; max-width: 70%; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  .tekst { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .game h2 { font-weight: 800; font-size: 20px; }
  .game p { font-size: 14px; line-height: 1.4; opacity: .85; flex: 1; }
  .speel {
    align-self: flex-start; margin-top: 6px; background: var(--rood); color: var(--wit);
    font-weight: 800; font-size: 14px; border-radius: 999px; padding: 8px 18px; letter-spacing: .5px;
  }
  .label {
    position: absolute; top: 10px; left: 10px; background: var(--wit); color: var(--zwart);
    font-weight: 700; font-size: 11px; border-radius: 999px; padding: 3px 9px; text-transform: uppercase;
  }
  footer { text-align: center; margin-top: 26px; font-size: 13px; opacity: .9; }
  footer a { color: var(--wit); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/logo_white.webp" alt="SNX">
    <div class="kaart-kop">
      <h1>SNX WORLD</h1>
      <p class="sub">Gratis snackgames. Kies je game en speel direct.</p>
    </div>
  </header>

  <nav class="filters" aria-label="Filter games">
    <button type="button" class="aan" data-f="alle">Alle games</button>
    <button type="button" data-f="ranglijst">Met ranglijst</button>
    <button type="button" data-f="snel">Even snel</button>
    <button type="button" data-f="pro">Voor ondernemers</button>
  </nav>

  <main class="grid" id="grid"></main>

  <footer>
    <p>Zet SNX World op je beginscherm en speel ook offline.</p>
    <p style="margin-top:6px"><a href="https://www.snxfood.com" target="_top" rel="noopener">www.snxfood.com</a></p>
  </footer>
</div>

<script>
const GAMES = [
  { url: 'snackrush.html', naam: 'Snack Rush', img: 'assets/bal.webp', tags: ['ranglijst', 'snel'], label: 'Ranglijst',
    tekst: 'Ren, spring en ontwijk de trucks. Vang zoveel mogelijk Betterballen en pak de jaartitel.' },
  { url: 'clubcup.html', naam: 'Club Cup', img: 'assets/burger.webp', tags: ['ranglijst'], label: 'Clubs',
    tekst: 'Padel, golf en penalty’s. Speel voor je eigen club en zet die bovenaan de clubranglijst.' },
  { url: 'match.html', naam: 'Snack Match', img: 'assets/kroket.webp', tags: ['snel'],
    tekst: 'Match drie of meer SNX-snacks en ruim het bord op. Level na level.' },
  { url: 'bubble.html', naam: 'Snack Blaster', img: 'assets/chickenbite.webp', tags: ['snel'],
    tekst: 'Schiet de bubbels met snacks weg voordat ze bij je zijn.' },
  { url: 'slot.html', naam: 'Power Slot', img: 'assets/doos.webp', tags: ['snel'], label: 'Zonder geld',
    tekst: 'Laat de rollen draaien voor snackpunten, free spins en de bitterbalfontein. Geen geld, geen inzet.' },
  { url: 'paardenrace.html', naam: 'SNX Derby', img: 'assets/chickenbites.webp', tags: ['snel'], label: 'NL · EN · AR',
    tekst: 'Kies je favoriet en juich je snackpaard naar de finish.' },
  { url: 'snxbar.html', naam: 'SNXbar Tycoon', img: 'assets/burger.webp', tags: ['pro'], label: 'Ondernemers',
    tekst: 'Bouw één SNXbar uit tot een snackketen door heel Europa, met echte SNX-inkoopprijzen.' }
];
const grid = document.getElementById('grid');
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toon(f) {
  grid.innerHTML = GAMES.filter((g) => f === 'alle' || g.tags.includes(f)).map((g) => `
    <a class="game" href="${g.url}">
      ${g.label ? `<span class="label">${esc(g.label)}</span>` : ''}
      <div class="beeld"><img src="${g.img}" alt="" loading="lazy"></div>
      <div class="tekst"><h2>${esc(g.naam)}</h2><p>${esc(g.tekst)}</p><span class="speel">SPEEL</span></div>
    </a>`).join('');
}
document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.filters button').forEach((x) => x.classList.toggle('aan', x === b));
  toon(b.dataset.f);
}));
toon('alle');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
